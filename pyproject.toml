[project]
name = "aidoor"
version = "0.1.2"
description = "ANSI-based BBS door for accessing local and remote language models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["bbs", "door", "ansi", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: BBS",
]

[project.scripts]
aidoor = "aidoor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
]

[tool.hatch.build]
include = ["src/aidoor/**/*.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/aidoor"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]
